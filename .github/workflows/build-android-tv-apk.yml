name: Build Android TV APK v1.2

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: android-tv-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build Ionic web app
        run: npm run build

      - name: Verify Angular web output
        run: test -f www/browser/index.html

      - name: Create Android Capacitor project
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor and apply Android TV configuration
        run: npm run cap:sync

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PCU-Queue-Android-TV-v1.2-debug.apk

      - name: Calculate SHA-256
        run: sha256sum PCU-Queue-Android-TV-v1.2-debug.apk > PCU-Queue-Android-TV-v1.2-debug.sha256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCU-Queue-Android-TV-v1.2-APK
          path: |
            PCU-Queue-Android-TV-v1.2-debug.apk
            PCU-Queue-Android-TV-v1.2-debug.sha256.txt
          if-no-files-found: error
          retention-days: 30
